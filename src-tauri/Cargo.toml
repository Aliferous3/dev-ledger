[package]
name = "dev-ledger"
version = "1.4.1"
description = "Dev Ledger — open-source GitHub analytics for developers"
authors = ["Noaman Ali"]
license = "AGPL-3.0-only"
repository = "https://github.com/Aliferous3/dev-ledger"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dev_ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Open external URLs in the system browser (no shell commands granted).
tauri-plugin-opener = "2"
# HTTP transport for the hosted API; rustls keeps builds OpenSSL-free and
# `unsafe-headers` is required so the desktop can send the exact Origin the
# hosted CSRF guard expects.
tauri-plugin-http = { version = "2", features = ["rustls-tls", "unsafe-headers"] }
# dev-ledger:// handoff from the system-browser OAuth flow.
# Pin the upstream patch fixing rust-ini 0.21.3 build compatibility
# (plugins-workspace#3711). Single-instance deep-link forwarding requires >=2.6.2.
tauri-plugin-deep-link = "=2.6.3"
# Route a second process launch (deep-link activation) back to one window.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# OS-backed credential storage: Windows Credential Manager, macOS Keychain,
# Linux Secret Service (pure-Rust zbus + rust crypto — no libdbus/openssl).
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  "crypto-rust",
] }
