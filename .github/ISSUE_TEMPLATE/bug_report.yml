name: Bug report
description: Report a reproducible problem in Dev Ledger
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include private repository names, credentials, tokens, or sensitive screenshots. Security vulnerabilities belong in the private process described in SECURITY.md.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Select …
        3. Click …
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Login / GitHub connection
        - Sync
        - Overview
        - Activity
        - Code
        - Share
        - Feedback
        - Privacy / Terms / Security pages
        - Other
    validations:
      required: true

  - type: input
    id: range
    attributes:
      label: Selected date range
      placeholder: 90D, ALL, CUSTOM, etc.

  - type: input
    id: browser
    attributes:
      label: Browser and version

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Remove private or identifying information before submitting.
