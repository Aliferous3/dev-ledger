name: Feature request
description: Propose an improvement to Dev Ledger
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or limitation should this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the experience or behavior you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: privacy
    attributes:
      label: Data impact
      options:
        - label: This proposal can be implemented without requiring Dev Ledger to persist repository source code, commit messages, pull-request titles, GitHub email addresses, or access tokens.
