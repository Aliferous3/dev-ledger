name: desktop

# Desktop build matrix. PR/main pushes produce CI artifacts only; an
# explicit `v*` tag produces the same artifacts and a DRAFT GitHub Release
# (never auto-published) with SHA-256 checksums for the package-manager
# manifests in distribution/.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quality gates — the desktop matrix and any tag-driven draft release
  # may only run after the full web-quality suite passes. A v* tag can
  # never produce even a draft release from a commit that fails these.
  verify:
    name: quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        # Lockfile-enforced; install lifecycle hooks never run (esbuild /
        # fsevents resolve through optional platform binaries instead).
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Audit
        run: npm audit --audit-level=moderate

  build:
    name: ${{ matrix.label }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            label: windows-x64
            artifact-glob: 'src-tauri/target/**/release/bundle/{nsis,msi}/*'
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg,app
            label: macos-arm64
            artifact-glob: 'src-tauri/target/**/release/bundle/{dmg,macos}/*'
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg,app
            label: macos-x64
            artifact-glob: 'src-tauri/target/**/release/bundle/{dmg,macos}/*'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            label: linux-x64
            artifact-glob: 'src-tauri/target/**/release/bundle/{deb,appimage}/*'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: src-tauri -> target

      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Ordinary PR/main/manual builds remain secret-free CI artifacts.
      # Release tags are different: Windows and macOS MUST pass the
      # platform signing path below or the tag build fails closed.
      - name: Build unsigned CI bundles
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || matrix.os == 'ubuntu-latest' }}
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Require Windows signing credentials for release tags
        if: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows-latest' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            throw 'WINDOWS_CERTIFICATE is required for a release tag'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'WINDOWS_CERTIFICATE_PASSWORD is required for a release tag'
          }

      - name: Import Windows signing certificate
        if: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows-latest' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $certDir = Join-Path $env:RUNNER_TEMP 'dev-ledger-signing'
          New-Item -ItemType Directory -Force -Path $certDir | Out-Null
          $encoded = Join-Path $certDir 'certificate-base64.txt'
          $pfx = Join-Path $certDir 'certificate.pfx'
          Set-Content -Path $encoded -Value $env:WINDOWS_CERTIFICATE
          certutil -decode $encoded $pfx | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'failed to decode WINDOWS_CERTIFICATE' }

          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $cert -or -not $cert.HasPrivateKey) { throw 'imported Windows certificate has no private key' }

          $timestamp = $env:WINDOWS_TIMESTAMP_URL
          if ([string]::IsNullOrWhiteSpace($timestamp)) {
            $timestamp = 'http://timestamp.digicert.com'
          }

          $overlay = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $cert.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = $timestamp
              }
            }
          }
          $overlay | ConvertTo-Json -Depth 6 | Set-Content -Path 'src-tauri/tauri.signing.windows.json'
          Remove-Item $encoded, $pfx -Force

      - name: Build signed Windows desktop bundles
        if: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows-latest' }}
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.signing.windows.json

      - name: Verify Windows Authenticode signatures
        if: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.os == 'windows-latest' }}
        shell: pwsh
        run: |
          $root = "src-tauri/target/${{ matrix.target }}/release"
          $files = @()
          $files += Get-ChildItem -Path $root -Filter 'dev-ledger.exe' -File
          $files += Get-ChildItem -Path (Join-Path $root 'bundle/nsis') -Filter '*.exe' -File
          $files += Get-ChildItem -Path (Join-Path $root 'bundle/msi') -Filter '*.msi' -File
          if ($files.Count -lt 3) { throw "expected signed app + NSIS + MSI, found $($files.Count)" }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            if ($signature.Status -ne 'Valid') {
              throw "invalid Authenticode signature on $($file.FullName): $($signature.Status)"
            }
          }

      - name: Require macOS signing and notarization credentials for release tags
        if: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-latest' }}
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is required for a release tag"
              exit 1
            fi
          done

      - name: Import macOS Developer ID certificate and notarization key
        if: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-latest' }}
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/dev-ledger-certificate.p12"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          KEYCHAIN_PATH="$RUNNER_TEMP/dev-ledger-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application:/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo '::error::Developer ID Application identity was not found after certificate import'
            exit 1
          fi

          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "APPLE_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          rm -f "$CERT_PATH"

      - name: Build signed and notarized macOS desktop bundles
        if: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-latest' }}
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Verify macOS signature and notarization ticket
        if: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-latest' }}
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' -print -quit)"
          DMG_PATH="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Clean macOS signing material
        if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-latest' }}
        shell: bash
        run: |
          if [ -n "${APPLE_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$APPLE_KEYCHAIN_PATH" || true
          fi
          rm -f "${APPLE_API_KEY_PATH:-}" "$RUNNER_TEMP/dev-ledger-certificate.p12"

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          find src-tauri/target -type f \( \
              -name '*.exe' -o -name '*.msi' -o \
              -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) \
            -path '*/bundle/*' -exec cp {} dist-artifacts/ \;
          # Normalize to the canonical release-asset filename contract —
          # package-manager manifests point at these exact names.
          node scripts/release-assets.mjs dist-artifacts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.label }}
          path: dist-artifacts/
          if-no-files-found: error

  release:
    name: draft-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true

      - name: SHA-256 checksums
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "Dev Ledger ${GITHUB_REF_NAME}" \
            --notes "Desktop builds for Windows, macOS and Linux. Windows artifacts are Authenticode-signed; macOS artifacts are Developer ID signed and notarized; Linux integrity is covered by SHA256SUMS.txt. This release is still a draft pending human verification." \
            artifacts/*

# NOTE: release is a DRAFT — a human verifies signatures, notarization,
# artifacts and checksums before publishing. Tag builds fail closed if the
# required Windows/macOS signing credentials are unavailable.
